<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#f7d9f4"><title>MapXP Vancouver</title><style>*{box-sizing:border-box}body{margin:0;background:#101820;color:#edf4fa;font:16px system-ui}header{padding:20px;display:flex;align-items:center;justify-content:space-between}h1{margin:0;font-size:26px}small{color:#a5b7c7}button,input{font:inherit}button{cursor:pointer;background:#263746;color:white;border:1px solid #405569;border-radius:10px;padding:12px}button:hover,button.active{background:#286b55}main{display:grid;grid-template-columns: minmax(0,1fr) 360px;gap:14px;padding:0 16px 16px}#map{height:76vh;border-radius:16px;background:#243846}aside{background:#1a2632;border-radius:16px;padding:16px;overflow:auto;max-height:76vh}nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.item{display:block;width:100%;text-align:left;margin:8px 0}.muted{color:#a5b7c7;font-size:13px}.bar{height:8px;background:#344555;border-radius:10px;overflow:hidden}.bar div{height:100%;background:#52d99c}h2{font-size:20px}#feedback{margin:12px 0;line-height:1.5}.tag{color:#6ce5a8;font-weight:bold}input{width:100%;padding:10px;border-radius:8px;margin:5px 0;background:#101820;color:white;border:1px solid #405569} @media(max-width:800px){main{grid-template-columns:1fr}#map{height:45vh}aside{max-height:none}header{padding:12px}}body{background:#fffdf5;color:#29253a;font-family:"Comic Sans MS","Chalkboard SE",system-ui}header{background:#f7d9f4;border-bottom:3px solid #dca5dc;margin-bottom:14px}small,.muted{color:#665d71}aside{background:#fffaf0;border:2px solid #c4db9c;box-shadow:3px 4px #e5ebd7}button{background:#fff;border:2px solid #b7a4d6;color:#302a40;font-weight:600}button:hover,button.active{background:#e0f3c9;color:#254f27}#map{height:auto;min-height:0;background:#fff;border:2px solid #b8d9ed;margin-top:10px;overflow:hidden}#map svg{width:100%;display:block} .roadline,.roadlabel,.pin{cursor:pointer}.roadline:hover{stroke-width:13}.roadlabel{font-size:12px;font-weight:bold;paint-order:stroke;stroke:#fff;stroke-width:3px;fill:#29253a}.hiddenlabels .maplabel{visibility:hidden}.tag{color:#34783b}input{background:white;color:#29253a}.bar{background:#e8e3ed}h2{background:#f8e0f1;padding:8px;border-radius:9px}#feedback strong{color:#245f35!important}</style></head><body><header><div><h1>MAP<span style="color:#52d99c">XP</span> / Vancouver</h1><small>Learn your city. One road at a time.</small></div><div id="xp" class="tag"></div></header><main><div><button id="toggle" onclick="toggleLabels()">Hide labels</button><div id="map"></div><p class="muted">Offline schematic • Approximate road shapes and pins • Not for navigation</p></div><aside><nav><button onclick="mode('explore')">Explore</button><button onclick="mode('quiz')">Quiz</button><button onclick="mode('route')">Routes</button><button onclick="mode('places')">Places</button></nav><div class="bar"><div id="progress"></div></div><p id="stats" class="muted"></p><div id="panel"></div></aside></main><script>
const roads=[['Highway 1','Regional expressway; westbound from Coquitlam toward Burnaby and Vancouver, eastbound toward Surrey via Port Mann.',49.248,-122.96,'#f36b6b'],['Lougheed Highway','Highway 7; runs through Brentwood and Coquitlam.',49.266,-123.0,'#59aaff'],['Kingsway','Diagonal corridor from Vancouver through Metrotown toward New Westminster.',49.227,-123.0,'#ffc35c'],['Canada Way','Crosses central Burnaby toward New Westminster.',49.244,-122.96,'#58d99a'],['Boundary Road','Much of the Vancouver–Burnaby boundary.',49.25,-123.023,'#b6a0ff'],['North Road','Much of the Burnaby–Coquitlam boundary.',49.25,-122.894,'#b6a0ff'],['Willingdon Avenue','Connects Brentwood and Metrotown.',49.25,-123.003,'#58d99a'],['Brunette Avenue','Maillardville corridor with Highway 1 access.',49.237,-122.86,'#ffc35c'],['Broadway','Vancouver’s 9th Avenue corridor.',49.263,-123.12,'#59aaff'],['West 16th Avenue','East–west corridor toward UBC.',49.257,-123.19,'#59aaff'],['Granville Street','Major north–south Vancouver street.',49.25,-123.139,'#58d99a'],['Nelson Avenue','Metrotown area; near Metrotown.',49.225,-122.99,'#58d99a'],['Grandview Highway','East Vancouver corridor connecting to Highway 1.',49.258,-123.04,'#ffc35c'],['Hastings Street','Northern Vancouver and Burnaby corridor.',49.281,-123.0,'#59aaff'],['Port Mann Bridge','Highway 1 crossing between Coquitlam and Surrey.',49.221,-122.814,'#f36b6b']];
const defaults=[['UBC','University of British Columbia',49.266,-123.25],['BC Place','777 Pacific Boulevard',49.2767,-123.1119]];let state;try{state=JSON.parse(localStorage.getItem('mapxp-v1'))||{xp:0,mastered:[],wrong:{},places:defaults}}catch(e){state={xp:0,mastered:[],wrong:{},places:defaults}};let map,layer, current='explore';const $=id=>document.getElementById(id);function save(){try{localStorage.setItem('mapxp-v1',JSON.stringify(state))}catch(e){}$('xp').textContent=`LV ${1+Math.floor(state.xp/100)} · ${state.xp} XP`;$('stats').textContent=`${state.mastered.length}/${roads.length} roads mastered`;$('progress').style.width=100*state.mastered.length/roads.length+'%'}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}const project=(lat,lon)=>[35+(lon+123.27)*1850,35+(49.30-lat)*3900];let hidden=false;const paths=[['M510 35 Q500 110 580 170 T730 250 L850 360',0],['M350 160 Q510 145 650 155 T880 170',1],['M310 175 L470 255 L640 330',2],['M420 185 Q540 220 650 300',3],['M455 55 V350',4],['M695 55 V270',5],['M530 65 V340',6],['M710 235 L815 235',7],['M45 160 H350',8],['M40 205 H370',9],['M255 95 V350',10],['M575 230 V345',11],['M350 190 H500',12],['M275 90 H670',13],['M850 360 L875 395',14]];function focus(lat,lon){const [x,y]=project(lat,lon);let c=$('focusdot');if(c){c.setAttribute('cx',x);c.setAttribute('cy',y);c.style.display='block'}}function pins(){draw()}function draw(){let svg=`<svg viewBox="0 0 900 420" role="img" aria-label="Simplified regional study map"><rect width="900" height="420" fill="#d8f3ff"/><path d="M15 130 Q80 45 230 65 L455 50 V350 L20 350Z" fill="#f7defa"/><path d="M455 50 L695 50 V340 L455 350Z" fill="#e1f5ce"/><path d="M695 50 H900 V335 L695 340Z" fill="#fff0bd"/><g class="maplabel" font-size="22" font-weight="bold"><text x="130" y="115" fill="#822e94">VANCOUVER</text><text x="505" y="115" fill="#387b32">BURNABY</text><text x="730" y="115" fill="#a36a22">COQUITLAM</text><text x="230" y="32" fill="#2476b0">Burrard Inlet</text><text x="340" y="400" fill="#2476b0">Fraser River</text><text x="860" y="30">↑ N</text></g>`;paths.forEach(([d,i])=>{let r=roads[i];svg+=`<path d="${d}" fill="none" stroke="${r[4]}" stroke-width="${i===0?9:6}" stroke-linecap="round" ${i===4||i===5?'stroke-dasharray="8 6"':''} class="roadline" onclick="road(${i})"><title>${r[0]}</title></path>`;let [x,y]=project(r[2],r[3]);svg+=`<text class="maplabel roadlabel" x="${x}" y="${y}" onclick="road(${i})">${r[0]}</text>`});state.places.forEach((p,i)=>{let [x,y]=project(p[2],p[3]);svg+=`<g class="pin" onclick="showPlace(${i})"><text x="${x}" y="${y}" font-size="27" fill="#ffd43b" stroke="#5b4514" stroke-width="1">★</text><text class="maplabel" x="${x+12}" y="${y+16}" font-size="14">${esc(p[0])}</text></g>`});$('map').innerHTML=svg+'<circle id="focusdot" r="15" fill="none" stroke="#222" stroke-width="3" style="display:none"/></svg>';$('map').classList.toggle('hiddenlabels',hidden)}function showPlace(i){let p=state.places[i];$('panel').innerHTML=`<h2>${esc(p[0])}</h2><p>${esc(p[1])}</p><button onclick="mode('places')">All places</button>`}function toggleLabels(){hidden=!hidden;draw();$('toggle').textContent=hidden?'Show labels':'Hide labels'}function mode(m){current=m;hidden=m==='quiz';pins();$('toggle').textContent=hidden?'Show labels':'Hide labels';document.querySelectorAll('nav button').forEach((b,i)=>b.classList.toggle('active',['explore','quiz','route','places'][i]===m));if(m==='explore')explore();if(m==='quiz')quiz();if(m==='route')route();if(m==='places')places()}
function explore(){$('panel').innerHTML='<h2>Road atlas</h2><p class="muted">Tap a road to study its location. Click a coloured road or its name. Shapes are simplified.</p>'+roads.map((r,i)=>`<button class="item" onclick="road(${i})"><span style="color:${r[4]}">●</span> ${r[0]} ${state.mastered.includes(i)?'✓':''}</button>`).join('');}function road(i){let r=roads[i];focus(r[2],r[3]);$('panel').innerHTML=`<button onclick="mode('explore')">← Atlas</button><h2 style="color:${r[4]}">${r[0]}</h2><p>${r[1]}</p><button onclick="learn(${i})">I remember this +10 XP</button><p class="muted">Recall where the road goes.</p>`}function learn(i){if(!state.mastered.includes(i)){state.mastered.push(i);state.xp+=10;save()}mode('explore')}
const questions=[['Which road is Metrotown on?',0,2],['Which highway crosses Port Mann?',0,0],['Which road separates Vancouver and Burnaby?',0,4],['Which road separates Burnaby and Coquitlam?',0,5],['Which road connects Brentwood and Metrotown?',0,6],['Which road in Maillardville provides Highway 1 access?',0,7],['Which road is Vancouver’s 9th Avenue?',0,8],['Which street runs north–south through central Vancouver?',0,10],['Which avenue is near Metrotown?',0,11],['Which corridor connects Highway 1 to East Vancouver?',0,12],['Which road is north of Kingsway and passes Brentwood?',0,1],['Which bridge connects Coquitlam and Surrey?',0,14],['Which avenue leads west toward UBC?',0,9],['Which road crosses central Burnaby toward New Westminster?',0,3],['Which street runs through northern Burnaby?',0,13]];let last=-1;function quiz(){let pool=questions.map((q,i)=>i).filter(i=>i!==last);let weights=pool.flatMap(i=>Array(1+Math.min(5,state.wrong[i]||0)).fill(i));let qi=weights[Math.floor(Math.random()*weights.length)];last=qi;let q=questions[qi],correct=q[2];let opts=[correct,...roads.map((r,i)=>i).filter(i=>i!==correct).sort(()=>Math.random()-.5).slice(0,3)].sort(()=>Math.random()-.5);$('panel').innerHTML=`<h2>Recall challenge</h2><p>${q[0]}</p>${opts.map(i=>`<button class="item answer" onclick="answer(${qi},${i})">${roads[i][0]}</button>`).join('')}<div id="feedback"></div>`}function answer(qi,i){document.querySelectorAll('.answer').forEach(b=>b.disabled=true);let c=questions[qi][2],ok=c===i;if(ok){state.xp+=15;state.wrong[qi]=Math.max(0,(state.wrong[qi]||0)-1);if(!state.mastered.includes(c))state.mastered.push(c)}else state.wrong[qi]=(state.wrong[qi]||0)+1;save();$('feedback').innerHTML=`<strong style="color:${ok?'#52d99c':'#ff8585'}">${ok?'Correct +15 XP':'Not quite — '+roads[c][0]}</strong><p>${roads[c][1]}</p><button onclick="focus(${roads[c][2]},${roads[c][3]})">Show area</button> <button onclick="quiz()">Next →</button>`}
const routes=[['Coquitlam → UBC',[['Which highway direction?',['Eastbound','Westbound'],1],['Which exit leads toward East Vancouver?',['Grandview Highway','Port Mann'],0],['Which avenue heads west toward UBC?',['West 16th','Granville Street'],0]]],['Metrotown → Vancouver',[['Which road are you starting on?',['Kingsway','Hastings'],0],['Which general direction?',['Northwest','Southeast'],0],['Which city boundary road?',['North Road','Boundary Road'],1]]],['Coquitlam → Surrey',[['Which highway?',['Highway 99','Highway 1'],1],['Which direction?',['Eastbound','Westbound'],0],['Which bridge?',['Port Mann','Lions Gate'],0]]]];function route(){$('panel').innerHTML='<h2>Route reasoning</h2><p class="muted">Conceptual challenges, not turn-by-turn navigation.</p>'+routes.map((r,i)=>`<button class="item" onclick="step(${i},0)">${r[0]}</button>`).join('')}function step(i,j){let r=routes[i];if(j===r[1].length){$('panel').innerHTML='<h2>Journey complete!</h2><button onclick="route()">Choose another</button>';return}let q=r[1][j];$('panel').innerHTML=`<h2>${r[0]}</h2><p class="muted">Checkpoint ${j+1}/${r[1].length}</p><p>${q[0]}</p>${q[1].map((o,k)=>`<button class="item" onclick="routeAnswer(${i},${j},${k})">${o}</button>`).join('')}<div id="feedback"></div>`}function routeAnswer(i,j,k){if(k===routes[i][1][j][2]){state.xp+=10;save();step(i,j+1)}else $('feedback').textContent='Try again. Think about the direction and destination.'}
function places(){$('panel').innerHTML='<h2>Personal landmarks</h2><p class="muted">Starter coordinates are approximate. Addresses and progress are stored in this browser when local storage is available.</p>'+state.places.map((p,i)=>`<button class="item" onclick="focus(${p[2]},${p[3]})">${esc(p[0])}<br><small>${esc(p[1])}</small></button><button onclick="edit(${i})">Edit pin</button>`).join('')+'<hr><button onclick="edit(-1)">Add landmark</button>'}function edit(i){let p=state.places[i]||['','',49.25,-123];$('panel').innerHTML=`<h2>Edit landmark</h2><label>Name<input id="pn" value="${esc(p[0])}"></label><label>Address<input id="pa" value="${esc(p[1])}"></label><label>Latitude<input id="plat" type="number" step="any" value="${p[2]}"></label><label>Longitude<input id="plon" type="number" step="any" value="${p[3]}"></label><button onclick="storePlace(${i})">Save</button> <button onclick="places()">Cancel</button>`}function storePlace(i){let p=[$('pn').value,$('pa').value,Number($('plat').value),Number($('plon').value)];if(!p[0]||!Number.isFinite(p[2])||!Number.isFinite(p[3])||Math.abs(p[2])>90||Math.abs(p[3])>180)return alert('Enter a valid name and coordinates');if(i<0)state.places.push(p);else state.places[i]=p;save();mode('places')}save();mode('explore');</script><script>if("serviceWorker" in navigator && location.protocol==="https:") navigator.serviceWorker.register("./sw.js").catch(console.warn);</script></body></html>
