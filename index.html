<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#f7d9f4"><title>MapXP Vancouver</title><style>*{box-sizing:border-box}body{margin:0;background:#101820;color:#edf4fa;font:16px system-ui}header{padding:20px;display:flex;align-items:center;justify-content:space-between}h1{margin:0;font-size:26px}small{color:#a5b7c7}button,input{font:inherit}button{cursor:pointer;background:#263746;color:white;border:1px solid #405569;border-radius:10px;padding:12px}button:hover,button.active{background:#286b55}main{display:grid;grid-template-columns: minmax(0,1fr) 360px;gap:14px;padding:0 16px 16px}#map{height:76vh;border-radius:16px;background:#243846}aside{background:#1a2632;border-radius:16px;padding:16px;overflow:auto;max-height:76vh}nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.item{display:block;width:100%;text-align:left;margin:8px 0}.muted{color:#a5b7c7;font-size:13px}.bar{height:8px;background:#344555;border-radius:10px;overflow:hidden}.bar div{height:100%;background:#52d99c}h2{font-size:20px}#feedback{margin:12px 0;line-height:1.5}.tag{color:#6ce5a8;font-weight:bold}input{width:100%;padding:10px;border-radius:8px;margin:5px 0;background:#101820;color:white;border:1px solid #405569} @media(max-width:800px){main{grid-template-columns:1fr}#map{height:45vh}aside{max-height:none}header{padding:12px}}body{background:#fffdf5;color:#29253a;font-family:"Comic Sans MS","Chalkboard SE",system-ui}header{background:#f7d9f4;border-bottom:3px solid #dca5dc;margin-bottom:14px}small,.muted{color:#665d71}aside{background:#fffaf0;border:2px solid #c4db9c;box-shadow:3px 4px #e5ebd7}button{background:#fff;border:2px solid #b7a4d6;color:#302a40;font-weight:600}button:hover,button.active{background:#e0f3c9;color:#254f27}#map{height:auto;min-height:0;background:#fff;border:2px solid #b8d9ed;margin-top:10px;overflow:hidden}#map svg{width:100%;display:block} .roadline,.roadlabel,.pin{cursor:pointer}.roadline:hover{stroke-width:13}.roadlabel{font-size:12px;font-weight:bold;paint-order:stroke;stroke:#fff;stroke-width:3px;fill:#29253a}.hiddenlabels .maplabel{visibility:hidden}.tag{color:#34783b}input{background:white;color:#29253a}.bar{background:#e8e3ed}h2{background:#f8e0f1;padding:8px;border-radius:9px}#feedback strong{color:#245f35!important}#map{overflow:auto}#map svg{min-width:850px}.roadlabel{font-size:13px} select{font:inherit;padding:8px;border:1px solid #b7a4d6;border-radius:8px;background:white;color:#29253a}.custompin text{pointer-events:all}</style></head><body><header><div><h1>MAP<span style="color:#52d99c">XP</span> / Vancouver</h1><small>Learn your city. One road at a time.</small></div><div id="xp" class="tag"></div></header><main><div><button id="toggle" onclick="toggleLabels()">Hide labels</button><div id="map"></div><p class="muted">Offline schematic • Approximate road shapes and pins • Not for navigation</p></div><aside><nav><button onclick="mode('explore')">Explore</button><button onclick="mode('quiz')">Quiz</button><button onclick="mode('route')">Routes</button><button onclick="mode('places')">Places</button><button onclick="mode('editor')">Map Editor</button></nav><div class="bar"><div id="progress"></div></div><p id="stats" class="muted"></p><div id="panel"></div></aside></main><script>
const roads=[['Highway 1','Regional expressway; westbound from Coquitlam toward Burnaby and Vancouver, eastbound toward Surrey via Port Mann.',49.248,-122.96,'#f36b6b'],['Lougheed Highway','Highway 7; runs through Brentwood and Coquitlam.',49.266,-123.0,'#59aaff'],['Kingsway','Diagonal corridor from Vancouver through Metrotown toward New Westminster.',49.227,-123.0,'#ffc35c'],['Canada Way','Crosses central Burnaby toward New Westminster.',49.244,-122.96,'#58d99a'],['Boundary Road','Much of the Vancouver–Burnaby boundary.',49.25,-123.023,'#b6a0ff'],['North Road','Much of the Burnaby–Coquitlam boundary.',49.25,-122.894,'#b6a0ff'],['Willingdon Avenue','Connects Brentwood and Metrotown.',49.25,-123.003,'#58d99a'],['Brunette Avenue','Maillardville corridor with Highway 1 access.',49.237,-122.86,'#ffc35c'],['Broadway','Vancouver’s 9th Avenue corridor.',49.263,-123.12,'#59aaff'],['West 16th Avenue','East–west corridor toward UBC.',49.257,-123.19,'#59aaff'],['Granville Street','Major north–south Vancouver street.',49.25,-123.139,'#58d99a'],['Nelson Avenue','Metrotown area; near Metrotown.',49.225,-122.99,'#58d99a'],['Grandview Highway','East Vancouver corridor connecting to Highway 1.',49.258,-123.04,'#ffc35c'],['Hastings Street','Northern Vancouver and Burnaby corridor.',49.281,-123.0,'#59aaff'],['Port Mann Bridge','Highway 1 crossing between Coquitlam and Surrey.',49.221,-122.814,'#f36b6b']];
const defaults=[['UBC','University of British Columbia',49.266,-123.25],['BC Place','777 Pacific Boulevard',49.2767,-123.1119],['Home','Coquitlam',49.24,-122.86],['Alma','West Broadway area',49.265,-123.185],['Dad’s office','Kingsway and Nelson',49.228,-122.995]];let state;try{state=JSON.parse(localStorage.getItem('mapxp-v1'))||{xp:0,mastered:[],wrong:{},places:defaults}}catch(e){state={xp:0,mastered:[],wrong:{},places:defaults}};for(const p of defaults){if(!state.places.some(q=>q[0].toLowerCase().replace(/[’']/g,'')===p[0].toLowerCase().replace(/[’']/g,'')))state.places.push([...p])};let map,layer, current='explore';const $=id=>document.getElementById(id);function save(){try{localStorage.setItem('mapxp-v1',JSON.stringify(state))}catch(e){}$('xp').textContent=`LV ${1+Math.floor(state.xp/100)} · ${state.xp} XP`;$('stats').textContent=`${state.mastered.length}/${roads.length} roads mastered`;$('progress').style.width=100*state.mastered.length/roads.length+'%'}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}const project=(lat,lon)=>[35+(lon+123.27)*1850,35+(49.30-lat)*3900];let hidden=false;roads.push(['Alma Street','West Side north–south street near Broadway.',49.266,-123.186,'#58d99a'],['Cambie Street','North–south Vancouver corridor.',49.25,-123.115,'#58d99a'],['Main Street','North–south corridor near the northwest end of Kingsway.',49.25,-123.10,'#58d99a'],['Austin Avenue','East–west Coquitlam corridor.',49.249,-122.86,'#ffc35c'],['Blue Mountain Street','North–south Coquitlam corridor.',49.25,-122.87,'#58d99a']);
const paths=[['M555 65 Q550 190 660 260 T930 350 L1080 460',0,710,300],['M410 225 Q650 175 845 210 T1120 235',1,680,193],['M300 245 L490 340 L740 440 L850 490',2,510,375],['M490 280 Q650 310 825 430',3,670,350],['M490 100 V470',4,480,150],['M845 100 V335',5,835,150],['M630 115 V470',6,620,140],['M865 315 Q930 320 1000 350',7,960,310],['M115 225 H410',8,230,215],['M45 280 H390',9,110,300],['M220 145 V470',10,210,415],['M720 345 V470',11,710,405],['M380 265 H660',12,405,255],['M300 125 H810',13,375,115],['M1080 460 L1125 520',14,1010,510],['M135 155 V380',15,125,345],['M275 155 V470',16,265,415],['M330 155 V470',17,320,450],['M865 275 H1120',18,990,265],['M960 145 V325',19,950,175]];
const oldProject=project;function mapPoint(lat,lon){return [Math.max(35,Math.min(1150,35+(lon+123.27)*2350)),Math.max(80,Math.min(530,65+(49.30-lat)*4900))]};function placePoint(p){const fixed={'Home':[1050,300],'Alma':[135,235],'Dad’s office':[720,430],'UBC':[55,250],'BC Place':[295,170]};return fixed[p[0]]||mapPoint(p[2],p[3])}function focus(lat,lon){let i=roads.findIndex(r=>r[2]===lat&&r[3]===lon);let p=i>=0?paths.find(p=>p[1]===i):null;let [x,y]=p?[p[2],p[3]]:mapPoint(lat,lon);let pp=state.places.find(p=>p[2]===lat&&p[3]===lon);if(pp)[x,y]=placePoint(pp);let c=$('focusdot');if(c){c.setAttribute('cx',x);c.setAttribute('cy',y);c.style.display='block'}}function pins(){draw()}function draw(){let svg=`<svg viewBox="0 0 1200 570" role="img" aria-label="Simplified regional study map"><rect width="1200" height="570" fill="#d8f3ff"/><path d="M20 150 Q80 80 230 100 L490 100 V480 L20 480Z" fill="#f7defa"/><path d="M490 100 H845 V470 L490 480Z" fill="#e1f5ce"/><path d="M845 100 H1180 V460 L845 470Z" fill="#fff0bd"/><g class="maplabel" font-size="23" font-weight="bold"><text x="145" y="75" fill="#822e94">VANCOUVER</text><text x="650" y="75" fill="#387b32">BURNABY</text><text x="935" y="75" fill="#a36a22">COQUITLAM</text><text x="320" y="32" fill="#2476b0">Burrard Inlet</text><text x="440" y="545" fill="#2476b0">Fraser River</text><text x="1130" y="35">↑ N</text></g>`;paths.forEach(([d,i])=>{let r=roads[i];svg+=`<path d="${d}" fill="none" stroke="${r[4]}" stroke-width="${i===0?9:6}" stroke-linecap="round" ${i===4||i===5?'stroke-dasharray="8 6"':''} class="roadline" onclick="road(${i})"><title>${r[0]}</title></path>`});paths.forEach(([d,i,x,y])=>{let vertical=[4,5,6,10,11,15,16,17,19].includes(i);svg+=`<text class="maplabel roadlabel" x="${x}" y="${y}" ${vertical?`transform="rotate(-90 ${x} ${y})" text-anchor="end"`:''} onclick="road(${i})">${roads[i][0]}</text>`});state.places.forEach((p,i)=>{let [x,y]=placePoint(p);svg+=`<g class="pin" onclick="showPlace(${i})"><text x="${x}" y="${y}" font-size="27" fill="#ffd43b" stroke="#5b4514" stroke-width="1">★</text><text class="maplabel" x="${x+12}" y="${y+16}" font-size="14">${esc(p[0])}</text></g>`});svg+=customMarkup();$('map').innerHTML=svg+'<circle id="focusdot" r="15" fill="none" stroke="#222" stroke-width="3" style="display:none"/></svg>';$('map').classList.toggle('hiddenlabels',hidden);wireEditor()}function showPlace(i){if(current==='editor')return;let p=state.places[i];$('panel').innerHTML=`<h2>${esc(p[0])}</h2><p>${esc(p[1])}</p><button onclick="mode('places')">All places</button>`}function toggleLabels(){hidden=!hidden;draw();$('toggle').textContent=hidden?'Show labels':'Hide labels'}function mode(m){current=m;hidden=m==='quiz';pins();$('toggle').textContent=hidden?'Show labels':'Hide labels';document.querySelectorAll('nav button').forEach((b,i)=>b.classList.toggle('active',['explore','quiz','route','places','editor'][i]===m));if(m==='explore')explore();if(m==='quiz')quiz();if(m==='route')route();if(m==='places')places();if(m==='editor')editor()}
function explore(){$('panel').innerHTML='<h2>Road atlas</h2><p class="muted">Tap a road to study its location. Click a coloured road or its name. Shapes are simplified.</p>'+roads.map((r,i)=>`<button class="item" onclick="road(${i})"><span style="color:${r[4]}">●</span> ${r[0]} ${state.mastered.includes(i)?'✓':''}</button>`).join('');}function road(i){if(current==='editor')return;let r=roads[i];focus(r[2],r[3]);$('panel').innerHTML=`<button onclick="mode('explore')">← Atlas</button><h2 style="color:${r[4]}">${r[0]}</h2><p>${r[1]}</p><button onclick="learn(${i})">I remember this +10 XP</button><p class="muted">Recall where the road goes.</p>`}function learn(i){if(!state.mastered.includes(i)){state.mastered.push(i);state.xp+=10;save()}mode('explore')}
const questions=[['Which road is Metrotown on?',0,2],['Which highway crosses Port Mann?',0,0],['Which road separates Vancouver and Burnaby?',0,4],['Which road separates Burnaby and Coquitlam?',0,5],['Which road connects Brentwood and Metrotown?',0,6],['Which road in Maillardville provides Highway 1 access?',0,7],['Which road is Vancouver’s 9th Avenue?',0,8],['Which street runs north–south through central Vancouver?',0,10],['Which avenue is near Metrotown?',0,11],['Which corridor connects Highway 1 to East Vancouver?',0,12],['Which road is north of Kingsway and passes Brentwood?',0,1],['Which bridge connects Coquitlam and Surrey?',0,14],['Which avenue leads west toward UBC?',0,9],['Which road crosses central Burnaby toward New Westminster?',0,3],['Which street runs through northern Burnaby?',0,13]];let last=-1;function quiz(){let pool=questions.map((q,i)=>i).filter(i=>i!==last);let weights=pool.flatMap(i=>Array(1+Math.min(5,state.wrong[i]||0)).fill(i));let qi=weights[Math.floor(Math.random()*weights.length)];last=qi;let q=questions[qi],correct=q[2];let opts=[correct,...roads.map((r,i)=>i).filter(i=>i!==correct).sort(()=>Math.random()-.5).slice(0,3)].sort(()=>Math.random()-.5);$('panel').innerHTML=`<h2>Recall challenge</h2><p>${q[0]}</p>${opts.map(i=>`<button class="item answer" onclick="answer(${qi},${i})">${roads[i][0]}</button>`).join('')}<div id="feedback"></div>`}function answer(qi,i){document.querySelectorAll('.answer').forEach(b=>b.disabled=true);let c=questions[qi][2],ok=c===i;if(ok){state.xp+=15;state.wrong[qi]=Math.max(0,(state.wrong[qi]||0)-1);if(!state.mastered.includes(c))state.mastered.push(c)}else state.wrong[qi]=(state.wrong[qi]||0)+1;save();$('feedback').innerHTML=`<strong style="color:${ok?'#52d99c':'#ff8585'}">${ok?'Correct +15 XP':'Not quite — '+roads[c][0]}</strong><p>${roads[c][1]}</p><button onclick="focus(${roads[c][2]},${roads[c][3]})">Show area</button> <button onclick="quiz()">Next →</button>`}
const routes=[['Home → Dad’s office',[['Which general direction?',['Southwest','Northeast'],0],['Which neighbourhood?',['Brentwood','Metrotown'],1],['Which intersection?',['Kingsway and Nelson','Hastings and Willingdon'],0]]],['Home → Alma',[['Which general direction?',['East','West'],1],['Which city is Alma in?',['Burnaby','Vancouver'],1],['Which nearby avenue?',['Broadway','Austin'],0]]],['Alma → BC Place',[['Which general direction?',['Northeast','Southwest'],0],['Which area?',['Downtown','Metrotown'],0]]],['Coquitlam → UBC',[['Which highway direction?',['Eastbound','Westbound'],1],['Which exit leads toward East Vancouver?',['Grandview Highway','Port Mann'],0],['Which avenue heads west toward UBC?',['West 16th','Granville Street'],0]]],['Metrotown → Vancouver',[['Which road are you starting on?',['Kingsway','Hastings'],0],['Which general direction?',['Northwest','Southeast'],0],['Which city boundary road?',['North Road','Boundary Road'],1]]],['Coquitlam → Surrey',[['Which highway?',['Highway 99','Highway 1'],1],['Which direction?',['Eastbound','Westbound'],0],['Which bridge?',['Port Mann','Lions Gate'],0]]]];function route(){$('panel').innerHTML='<h2>Route reasoning</h2><p class="muted">Conceptual challenges, not turn-by-turn navigation.</p>'+routes.map((r,i)=>`<button class="item" onclick="step(${i},0)">${r[0]}</button>`).join('')}function step(i,j){let r=routes[i];if(j===r[1].length){$('panel').innerHTML='<h2>Journey complete!</h2><button onclick="route()">Choose another</button>';return}let q=r[1][j];$('panel').innerHTML=`<h2>${r[0]}</h2><p class="muted">Checkpoint ${j+1}/${r[1].length}</p><p>${q[0]}</p>${q[1].map((o,k)=>`<button class="item" onclick="routeAnswer(${i},${j},${k})">${o}</button>`).join('')}<div id="feedback"></div>`}function routeAnswer(i,j,k){if(k===routes[i][1][j][2]){state.xp+=10;save();step(i,j+1)}else $('feedback').textContent='Try again. Think about the direction and destination.'}
function places(){$('panel').innerHTML='<h2>Personal landmarks</h2><p class="muted">Starter coordinates are approximate. Addresses and progress are stored in this browser when local storage is available.</p>'+state.places.map((p,i)=>`<button class="item" onclick="focus(${p[2]},${p[3]})">${esc(p[0])}<br><small>${esc(p[1])}</small></button><button onclick="edit(${i})">Edit pin</button>`).join('')+'<hr><button onclick="edit(-1)">Add landmark</button>'}function edit(i){let p=state.places[i]||['','',49.25,-123];$('panel').innerHTML=`<h2>Edit landmark</h2><label>Name<input id="pn" value="${esc(p[0])}"></label><label>Address<input id="pa" value="${esc(p[1])}"></label><label>Latitude<input id="plat" type="number" step="any" value="${p[2]}"></label><label>Longitude<input id="plon" type="number" step="any" value="${p[3]}"></label><button onclick="storePlace(${i})">Save</button> <button onclick="places()">Cancel</button>`}function storePlace(i){let p=[$('pn').value,$('pa').value,Number($('plat').value),Number($('plon').value)];if(!p[0]||!Number.isFinite(p[2])||!Number.isFinite(p[3])||Math.abs(p[2])>90||Math.abs(p[3])>180)return alert('Enter a valid name and coordinates');if(i<0)state.places.push(p);else state.places[i]=p;save();mode('places')}questions.push(['Which street is near West Broadway on the West Side?',0,15],['Which north–south street is west of Main?',0,16],['Which street is near the northwest end of Kingsway?',0,17],['Which avenue runs east–west in Coquitlam?',0,18],['Which Coquitlam street runs north–south?',0,19]);
state.labels=Array.isArray(state.labels)?state.labels:[];
let pending=null, selected=-1, moving=false;
const colors=['#29253a','#822e94','#2476b0','#387b32','#a36a22','#d34c58'];
const symbols=['★','●','◆','🏠','💼',''];
function customMarkup(){return state.labels.map((p,i)=>`<g class="custompin" data-label="${i}" style="cursor:pointer"><circle cx="${p.x}" cy="${p.y}" r="15" fill="transparent"/><text x="${p.x}" y="${p.y}" text-anchor="middle" font-size="23" fill="${colors.includes(p.color)?p.color:colors[0]}" stroke="white" stroke-width="2" paint-order="stroke">${esc(p.symbol)}</text><text class="maplabel" x="${p.x}" y="${p.y+18}" text-anchor="${p.x>1080?'end':p.x<120?'start':'middle'}" font-size="15" font-weight="bold" fill="${colors.includes(p.color)?p.color:colors[0]}" stroke="white" stroke-width="3" paint-order="stroke">${esc(p.name)}</text></g>`).join('')+(pending&&current==='editor'?`<circle cx="${pending.x}" cy="${pending.y}" r="9" fill="none" stroke="#29253a" stroke-width="3"/>`:'')}
function wireEditor(){const svg=$('map').querySelector('svg');svg.addEventListener('click',e=>{if(current!=='editor')return;const hit=e.target.closest('[data-label]');if(hit&&!moving){openLabel(Number(hit.dataset.label));return}const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const matrix=svg.getScreenCTM();if(!matrix)return;const q=pt.matrixTransform(matrix.inverse());pending={x:Math.max(20,Math.min(1180,q.x)),y:Math.max(25,Math.min(540,q.y))};if(moving&&selected>=0){Object.assign(state.labels[selected],pending);save();moving=false;pending=null;draw();openLabel(selected)}else{selected=-1;draw();labelForm(-1)}} ,true);}
function editor(){pending=null;selected=-1;moving=false;draw();$('panel').innerHTML='<h2>Map Editor</h2><p>Tap anywhere on the map to add a label. Tap an existing custom label to edit it.</p><p class="muted">Private to this browser. Positions are schematic, not GPS coordinates.</p>'+state.labels.map((p,i)=>`<button class="item" onclick="openLabel(${i})">${esc(p.symbol)} ${esc(p.name)}</button>`).join('');}
function openLabel(i){selected=i;pending=null;moving=false;labelForm(i)}
function labelForm(i){const p=state.labels[i]||{name:'',color:colors[0],symbol:'★'};$('panel').innerHTML=`<h2>${i<0?'New label':'Edit label'}</h2><label>Name<input id="ln" maxlength="70" value="${esc(p.name)}" placeholder="e.g. Home"></label><label>Colour <select id="lc">${colors.map((c,j)=>`<option value="${c}" ${p.color===c?'selected':''}>${['Black','Purple','Blue','Green','Orange','Red'][j]}</option>`).join('')}</select></label><p><label>Symbol <select id="ls">${symbols.map(c=>`<option value="${esc(c)}" ${p.symbol===c?'selected':''}>${c||'Text only'}</option>`).join('')}</select></label></p><button onclick="storeLabel(${i})">Save label</button> ${i>=0?`<button onclick="moveLabel(${i})">Move</button> <button onclick="deleteLabel(${i})">Delete</button>`:''} <button onclick="editor()">Cancel</button>`;$('ln').focus()}
function storeLabel(i){const name=$('ln').value.trim();if(!name)return alert('Enter a label name');const pos=i<0?pending:state.labels[i];if(!pos)return;const p={x:pos.x,y:pos.y,name,color:$('lc').value,symbol:$('ls').value};if(i<0)state.labels.push(p);else state.labels[i]=p;save();editor()}
function moveLabel(i){selected=i;moving=true;pending=null;$('panel').innerHTML='<h2>Move label</h2><p>Tap the new position on the map.</p><button onclick="editor()">Cancel</button>'}
function deleteLabel(i){if(confirm('Delete this label?')){state.labels.splice(i,1);save();editor()}}
save();mode('explore');</script><script>if("serviceWorker" in navigator && location.protocol==="https:") navigator.serviceWorker.register("./sw.js").catch(console.warn);</script></body></html>
